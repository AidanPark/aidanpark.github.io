<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoxBee — Mobile Apps</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    line-height: 1.6; display: flex; min-height: 100vh; align-items: center; justify-content: center;
    background: #fafafa; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } .card { background: #1c1c1e !important; } }
  main { max-width: 640px; padding: 2rem; }
  h1 { font-size: 1.8rem; margin-bottom: .3rem; }
  .tagline { opacity: .7; margin-bottom: 2rem; }
  .card {
    background: #fff; border-radius: 16px; padding: 1.5rem;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 1.2rem;
  }
  .card h2 { font-size: 1.2rem; margin-bottom: .4rem; }
  .card p { opacity: .8; margin-bottom: .8rem; }
  a.store {
    display: inline-block; background: #01875f; color: #fff; text-decoration: none;
    padding: .55rem 1.2rem; border-radius: 24px; font-weight: 600; font-size: .95rem;
  }
  a.guide {
    display: inline-block; margin-left: 1rem; color: #01875f; text-decoration: none;
    font-weight: 600; font-size: .95rem;
  }
  footer { margin-top: 2rem; font-size: .85rem; opacity: .6; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>BoxBee</h1>
  <p class="tagline">Useful mobile apps, built with care.</p>

  <div class="card">
    <h2>Screen Translate: OCR &amp; Live</h2>
    <p>Translate any text on your screen in real time — games, chats, images, apps. On-screen OCR translation for 110+ languages.</p>
    <a class="store" href="https://play.google.com/store/apps/details?id=com.galaxy.airviewdictionary">Get it on Google Play</a>
    <a class="guide" href="/guide/">How to use →</a>
  </div>

  <footer>
    Contact: <a href="mailto:handwritingdictionary@gmail.com">handwritingdictionary@gmail.com</a><br>
    © 2026 BoxBee Corp.
  </footer>
</main>
</body>
</html>
